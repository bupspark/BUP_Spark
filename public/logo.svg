<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/> <!-- Silver/slate -->
      <stop offset="100%" stop-color="#1e293b"/> <!-- Dark slate -->
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sparkle / Sunburst -->
  <g transform="translate(145, 55)" filter="url(#glow)">
    <path d="M0 -30 L5 -10 L25 -5 L5 0 L0 20 L-5 0 L-25 -5 L-5 -10 Z" fill="#93c5fd"/>
    <path d="M0 -20 L2 -6 L15 -3 L2 0 L0 10 L-2 0 L-15 -3 L-2 -6 Z" fill="#ffffff"/>
  </g>

  <!-- The B Letter Base -->
  <path d="M70 160 L70 40 L110 40 C140 40 155 50 155 70 C155 85 145 95 130 100 C150 105 160 120 160 140 C160 155 145 160 110 160 Z M90 90 L115 90 C125 90 130 85 130 75 C130 65 125 60 110 60 L90 60 Z M90 140 L115 140 C130 140 135 135 135 120 C135 110 130 108 115 108 L90 108 Z" fill="url(#logoGrad)" stroke="#3b82f6" stroke-width="2"/>

  <!-- Inner circuitry -->
  <path d="M80 50 L105 50 C120 50 125 55 125 65" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 150 L105 150 C120 150 125 145 125 135" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Circuit nodes outside -->
  <circle cx="45" cy="85" r="8" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="40" cy="120" r="10" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="55" cy="145" r="6" fill="#1e293b" stroke="#93c5fd" stroke-width="2"/>

  <!-- Connecting lines -->
  <path d="M45 85 L70 70 M40 120 L90 90 M55 145 L90 140" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="90" cy="90" r="4" fill="#ffffff"/>
  <circle cx="90" cy="140" r="4" fill="#ffffff"/>
  <circle cx="70" cy="70" r="4" fill="#ffffff"/>
</svg>
